[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sample-agent"
version = "0.1.0"
description = "Minimal project used to demonstrate automated code review"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PyJWT==2.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]
